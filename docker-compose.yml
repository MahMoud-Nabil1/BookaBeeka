services:
  # ==============================================================================
  # Backend Service (Spring Boot 4.x / Java 21)
  # ==============================================================================
  backend:
    build:
      context: ./Backend
      dockerfile: Dockerfile
    container_name: bookabeeka-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8081}:8081"
    env_file:
      - path: ./.env
        required: false
      - path: ./Backend/.env
        required: false
    environment:
      - SERVER_PORT=8081
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost}
    networks:
      - bookabeeka-network

  # ==============================================================================
  # Frontend Service (React / Vite / Tailwind served by Nginx)
  # ==============================================================================
  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
      args:
        # Client-side API URL injected into Vite during build time
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}
    container_name: bookabeeka-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      - backend
    networks:
      - bookabeeka-network

  # ==============================================================================
  # Optional Local Database (PostgreSQL 16)
  # ==============================================================================
  # Active only when requested via `--profile local-db`.
  # Default setup connects to Neon cloud database via Backend/.env.
  # To run offline with local PostgreSQL:
  #   docker compose --profile local-db up -d
  # And point SPRING_DATASOURCE_URL to:
  #   jdbc:postgresql://postgres:5432/bookabeeka?sslmode=disable
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: bookabeeka-postgres
    restart: unless-stopped
    profiles:
      - local-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bookabeeka}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - bookabeeka-network

networks:
  bookabeeka-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
