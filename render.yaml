services:
  # ============================================================================
  # Backend API - Spring Boot (Docker)
  # ============================================================================
  - type: web
    name: bookabeeka-backend
    runtime: docker
    dockerfilePath: Backend/Dockerfile
    dockerContext: Backend
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8080
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRATION_TIME
        value: 86400000
      - key: CORS_ALLOWED_ORIGINS
        value: "*"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: APP_MAIL_ENABLED
        value: "true"
      - key: SPRING_MAIL_HOST
        value: smtp.gmail.com
      - key: SPRING_MAIL_PORT
        value: "587"
      - key: SPRING_MAIL_USERNAME
        sync: false
      - key: SPRING_MAIL_PASSWORD
        sync: false
      - key: APP_BASE_URL
        fromService:
          type: web
          name: bookabeeka-frontend
          property: host

  # ============================================================================
  # Frontend SPA - React + Vite + Tailwind (Static Site)
  # ============================================================================
  - type: web
    name: bookabeeka-frontend
    runtime: static
    rootDir: FrontEnd
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    autoDeploy: true
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: bookabeeka-backend
          property: host
