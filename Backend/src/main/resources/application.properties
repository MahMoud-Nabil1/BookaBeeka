spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_vrP2ONMthD4z}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) — tuned for Neon serverless Postgres
# connectionTimeout: 30s — generous enough to survive Neon cold-start (~500ms–2s)
spring.datasource.hikari.connection-timeout=30000
# maximumPoolSize: 5 — Neon free tier limits total connections; don't exhaust them
spring.datasource.hikari.maximum-pool-size=5
# maxLifetime: 10 min — Neon idles connections after ~5 min; recycle before that
spring.datasource.hikari.max-lifetime=600000
# keepaliveTime: 60s — send a keepalive ping to prevent Neon dropping idle connections
spring.datasource.hikari.keepalive-time=60000

# Spring Cache — Caffeine (in-process, per-cache TTL configured in CacheConfig.java)
spring.cache.type=caffeine

# JPA / Hibernate Configuration & Dialect
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# Statistics: logs "JDBC statements prepared: N" after each session — for before/after SQL count proof
# Set to false in production once tuning is done
spring.jpa.properties.hibernate.generate_statistics=true
logging.level.org.hibernate.stat=DEBUG

# Error Handling
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

