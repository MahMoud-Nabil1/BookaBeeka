server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip Compression for fast delivery
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/x-javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml;

    # Cache hashed static assets generated by Vite
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";

        # Keep MIME-sniffing protection on JS/CSS assets
        add_header X-Content-Type-Options "nosniff" always;

        # Don't clutter access logs with every static asset request
        access_log off;
    }

    # Single Page Application (SPA) routing:
    location / {
        try_files $uri $uri/ /index.html;

        # Cache control for HTML entrypoint
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Fallback for server errors
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
