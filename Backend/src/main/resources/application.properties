spring.application.name=backend
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ==========================================
# Datasource Configuration
# ==========================================
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) Timeout for Cloud DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# ==========================================
# JPA / Hibernate Configuration
# ==========================================
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ==========================================
# Error Handling & Security
# ==========================================
spring.web.error.include-message=never
spring.web.error.include-stacktrace=never

# ==========================================
# JWT Security Configuration
# ==========================================
security.jwt.secret-key=${JWT_SECRET_KEY}
security.jwt.expiration-time=${JWT_EXPIRATION_TIME:86400000}

# ==========================================
# Cloudinary Configuration
# ==========================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================
# Media Configuration
# ==========================================
media.max-photos-per-resource=${MEDIA_MAX_PHOTOS:20}
media.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE:10485760}

# ==========================================
# Application Base URL
# ==========================================
app.base-url=${APP_BASE_URL:http://localhost:5173}

# ==========================================
# Mail & Notification Configuration
# ==========================================
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=${SPRING_MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SPRING_MAIL_SMTP_STARTTLS_ENABLE:true}

app.mail.enabled=${APP_MAIL_ENABLED:true}

# Retry Scheduler
notification.retry.enabled=true
notification.retry.max-attempts=3
notification.retry.batch-size=50
notification.retry.delay-ms=60000

# ==========================================
# Spring Data Web / Pagination
# ==========================================
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100