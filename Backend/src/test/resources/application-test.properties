spring.datasource.url=jdbc:h2:mem:booking_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;NON_KEYWORDS=VALUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Explicitly target H2 dialect to avoid Hibernate auto-detection picking PostgreSQLDialect.
# This is critical for integration tests that use JsonbType/JdbcTypeCode(JSON) fields —
# without this override, Hibernate may attempt PostgreSQL-specific JSONB DDL on H2, causing schema creation errors.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect

security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=86400000