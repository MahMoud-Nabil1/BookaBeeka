spring.application.name=backend
server.port=${SERVER_PORT:8081}
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}
spring.security.user.name=admin
spring.security.user.password=password

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-still-hill-ax65n74w-pooler.c-4.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_vrP2ONMthD4z}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) Timeout for Cloud DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate Configuration & Dialect
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Error Handling
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

# ==========================================
# JWT Security Configuration
# ==========================================
security.jwt.secret-key=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
security.jwt.expiration-time=86400000
# ==========================================
# Mail & Notification Configuration
# ==========================================
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.username=
spring.mail.password=
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# تعطيل الإرسال الفعلي وطباعة الإيميلات في الـ Logs محلياً (Mock Mode)
app.mail.enabled=false

# إعدادات جدول إعادة المحاولة للإشعارات الفاشلة (Retry Scheduler)
notification.retry.enabled=true
notification.retry.max-attempts=3
notification.retry.batch-size=50
notification.retry.delay-ms=60000