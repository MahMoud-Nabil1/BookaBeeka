spring.application.name=backend
server.port=${SERVER_PORT:8081}
spring.security.user.name=admin
spring.security.user.password=password

# Datasource Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://ep-still-hill-ax65n74w-pooler.c-4.us-east-2.aws.neon.tech:5432/neondb?sslmode=require}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:neondb_owner}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:npg_vrP2ONMthD4z}
spring.datasource.driver-class-name=org.postgresql.Driver

# Connection Pool (HikariCP) Timeout for Cloud DB
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10

# JPA / Hibernate Configuration & Dialect
spring.jpa.database=postgresql
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Error Handling
spring.web.error.include-message=always
spring.web.error.include-stacktrace=always

